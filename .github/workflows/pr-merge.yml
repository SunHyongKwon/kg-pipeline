# PR이 열리면 머지를 처리합니다.
#
# CI가 있는 레포:  auto-merge로 예약 -> check 통과 후 자동 머지
# CI가 없는 레포:  auto-merge가 거부되므로(대기할 게 없음) 바로 squash 머지
#
# 한 파일로 두 경우를 모두 처리하므로 레포마다 갈아끼울 필요가 없습니다.

name: pr-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    # 본인이 연 PR만. public 레포에서 이 조건을 지우면 아무나 머지시킬 수 있습니다.
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      # checkout 스텝을 절대 추가하지 마세요.
      # pull_request_target은 base 레포 권한으로 도는 트리거라
      # PR 코드를 체크아웃하면 토큰이 그대로 노출됩니다.
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr merge --auto --squash "$PR"; then
            echo "auto-merge 예약됨 (check 통과 대기)"
          else
            echo "auto-merge 불가 -> 즉시 머지"
            gh pr merge --squash "$PR"
          fi

      # 레포 설정 delete_branch_on_merge=true 는 GITHUB_TOKEN 이 머지한 경우에는
      # 동작하지 않습니다(사람이 머지할 때만 걸립니다). 그래서 여기서 직접 지웁니다.
      #
      # gh pr merge --delete-branch 를 쓰지 않는 이유 — --auto 와 같이 쓸 때의 동작이
      # 문서화돼 있지 않습니다. 아래는 '실제로 머지됐는지' 를 확인하고 지웁니다.
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # auto-merge 예약만 된 상태에서 지우면 PR 이 닫혀 버립니다. 반드시 확인 후에.
          state=$(gh pr view "$PR" --json state --jq .state)
          if [ "$state" != "MERGED" ]; then
            echo "state=$state -> 아직 머지 안 됨. 브랜치 유지"
            exit 0
          fi

          # 같은 레포의 브랜치만. fork 에서 온 PR 이면 이 이름이 base 레포의
          # 다른 브랜치를 가리킬 수 있습니다.
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "fork PR ($HEAD_REPO) -> 건너뜀"
            exit 0
          fi
          # default 브랜치는 어떤 경우에도 지우지 않습니다.
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "head 가 default 브랜치($DEFAULT_BRANCH) -> 건너뜀"
            exit 0
          fi

          if gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" --silent; then
            echo "브랜치 삭제: $HEAD_REF"
          else
            echo "브랜치 삭제 실패 (이미 없을 수 있음) -> 무시"
          fi
